name: Publish Pi distribution branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-distribution
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build:
    if: github.repository == 'ian-ross/plannotator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun test scripts/pi-distribution.test.ts
      - run: bun run build:pi

      - name: Prepare standalone package
        run: |
          node scripts/prepare-pi-distribution.mjs "$RUNNER_TEMP/pi-distribution"
          cd "$RUNNER_TEMP/pi-distribution"
          npm install --package-lock-only --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Test clean npm install and Pi command dispatch
        run: node scripts/smoke-pi-distribution.mjs "$RUNNER_TEMP/pi-distribution"

      - name: Archive package
        run: tar -czf "$RUNNER_TEMP/pi-distribution.tar.gz" -C "$RUNNER_TEMP/pi-distribution" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-distribution
          path: ${{ runner.temp }}/pi-distribution.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-pi-distribution.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-distribution
          path: ${{ runner.temp }}/pi-artifact

      # This job never installs dependencies or executes code from the package.
      - name: Publish plannotator-pi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/pi-distribution"
          tar -xzf "$RUNNER_TEMP/pi-artifact/pi-distribution.tar.gz" -C "$RUNNER_TEMP/pi-distribution"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          bash scripts/publish-pi-distribution.sh "$RUNNER_TEMP/pi-distribution" "https://github.com/$GITHUB_REPOSITORY.git"
